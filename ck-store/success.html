<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enrollment Confirmed — Coastal Key Property Management</title>
  <style>
    :root { --navy: #1B2A4A; --sand: #D2C4A0; --ocean: #2E86AB; --success: #059669; --font: system-ui, -apple-system, sans-serif; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: var(--font); background: #F8FAFC; color: #1E293B; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; }
    .card { background: white; border-radius: 16px; padding: 48px; max-width: 500px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    .check { width: 64px; height: 64px; background: var(--success); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 24px; font-size: 2rem; color: white; }
    h1 { font-size: 1.5rem; color: var(--navy); margin-bottom: 12px; }
    p { color: #64748B; margin-bottom: 24px; line-height: 1.6; }
    a { display: inline-block; padding: 12px 28px; background: var(--navy); color: white; border-radius: 8px; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <div class="card">
    <div class="check">&#10003;</div>
    <h1>Enrollment Confirmed</h1>
    <p>Welcome to Coastal Key Property Management. Your account is being set up and a member of our team will contact you within 24 hours to schedule your first property inspection.</p>
    <p>Check your email for a confirmation receipt and next steps.</p>
    <a href="https://coastalkey-pm.com">Return to coastalkey-pm.com</a>
  </div>
</body>
</html>
