name: Deploy Coastal Key Platform

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  WRANGLER_VERSION: '4'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Initialize data files
        run: node scripts/init-data.js
      - name: Install gateway dependencies
        working-directory: ck-api-gateway
        run: npm install --legacy-peer-deps
      - name: Install sentinel dependencies
        if: hashFiles('sentinel-webhook/package.json') != ''
        working-directory: sentinel-webhook
        run: npm install --legacy-peer-deps
      - name: Install nemotron dependencies
        if: hashFiles('ck-nemotron-worker/package.json') != ''
        working-directory: ck-nemotron-worker
        run: npm install --legacy-peer-deps
      - name: Test Express Server
        run: npm run test:server
      - name: Test API Gateway
        working-directory: ck-api-gateway
        run: npm test
      - name: Test Sentinel Webhook
        if: hashFiles('sentinel-webhook/package.json') != ''
        working-directory: sentinel-webhook
        run: npm test
      - name: Test Nemotron Worker
        if: hashFiles('ck-nemotron-worker/package.json') != ''
        working-directory: ck-nemotron-worker
        run: npm test

  deploy-website:
    name: Deploy Website
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install wrangler
        run: npm install -g wrangler@${{ env.WRANGLER_VERSION }}
      - name: Deploy to Cloudflare Pages
        run: |
          wrangler pages project create coastalkey-pm --production-branch=main 2>&1 || true
          for i in 1 2 3; do
            wrangler pages deploy ck-website --project-name=coastalkey-pm --branch=main --commit-dirty=true && break
            echo "Attempt $i failed, retrying in 15s..." && sleep 15
          done

  deploy-command-center:
    name: Deploy Command Center
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install wrangler
        run: npm install -g wrangler@${{ env.WRANGLER_VERSION }}
      - name: Deploy to Cloudflare Pages
        run: |
          wrangler pages project create ck-command-center --production-branch=main 2>&1 || true
          for i in 1 2 3; do
            wrangler pages deploy ck-command-center --project-name=ck-command-center --branch=main --commit-dirty=true && break
            echo "Attempt $i failed, retrying in 15s..." && sleep 15
          done

  deploy-store:
    name: Deploy Store
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install wrangler
        run: npm install -g wrangler@${{ env.WRANGLER_VERSION }}
      - name: Deploy to Cloudflare Pages
        run: |
          wrangler pages project create ck-store --production-branch=main 2>&1 || true
          for i in 1 2 3; do
            wrangler pages deploy ck-store --project-name=ck-store --branch=main --commit-dirty=true && break
            echo "Attempt $i failed, retrying in 15s..." && sleep 15
          done
      - name: Provision store.coastalkey-pm.com custom domain + DNS (SIG-04)
        run: |
          set +e
          API="https://api.cloudflare.com/client/v4"
          AUTH="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          DOMAIN="store.coastalkey-pm.com"
          ZONE="coastalkey-pm.com"

          # 1. Attach the custom domain to the ck-store Pages project (idempotent)
          curl -sS -X POST "$API/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/ck-store/domains" \
            -H "$AUTH" -H "Content-Type: application/json" \
            -d "{\"name\":\"$DOMAIN\"}" | head -c 600; echo

          # 2. Resolve the zone id for coastalkey-pm.com
          ZONE_ID=$(curl -sS "$API/zones?name=${ZONE}&status=active" -H "$AUTH" \
            | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{try{const j=JSON.parse(d);console.log(j.result&&j.result[0]?j.result[0].id:'')}catch{console.log('')}})")
          if [ -z "$ZONE_ID" ]; then echo "Zone $ZONE not found on this account — DNS step skipped (custom domain still attached)."; exit 0; fi
          echo "Zone id: $ZONE_ID"

          # 3. Create the proxied CNAME store -> ck-store.pages.dev (skip if it already exists)
          EXISTS=$(curl -sS "$API/zones/$ZONE_ID/dns_records?type=CNAME&name=${DOMAIN}" -H "$AUTH" \
            | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{try{const j=JSON.parse(d);console.log(j.result&&j.result.length?'yes':'no')}catch{console.log('no')}})")
          if [ "$EXISTS" = "yes" ]; then
            echo "CNAME $DOMAIN already exists — nothing to do."
          else
            curl -sS -X POST "$API/zones/$ZONE_ID/dns_records" \
              -H "$AUTH" -H "Content-Type: application/json" \
              -d "{\"type\":\"CNAME\",\"name\":\"store\",\"content\":\"ck-store.pages.dev\",\"proxied\":true,\"comment\":\"Coastal Key Store — SIG-04\"}" | head -c 600; echo
          fi

  deploy-gateway:
    name: Deploy API Gateway
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install wrangler
        run: npm install -g wrangler@${{ env.WRANGLER_VERSION }}
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Install gateway dependencies
        working-directory: ck-api-gateway
        run: npm install --legacy-peer-deps
      - name: Deploy to Cloudflare
        working-directory: ck-api-gateway
        run: |
          for i in 1 2 3; do
            npx wrangler deploy && break
            echo "Attempt $i failed, retrying in 15s..." && sleep 15
          done

  deploy-sentinel:
    name: Deploy Sentinel Webhook
    needs: [test, deploy-gateway]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && hashFiles('sentinel-webhook/package.json') != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install wrangler
        run: npm install -g wrangler@${{ env.WRANGLER_VERSION }}
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Install sentinel dependencies
        working-directory: sentinel-webhook
        run: npm install --legacy-peer-deps
      - name: Deploy to Cloudflare
        working-directory: sentinel-webhook
        run: |
          for i in 1 2 3; do
            npx wrangler deploy && break
            echo "Attempt $i failed, retrying in 15s..." && sleep 15
          done

  deploy-nemotron:
    name: Deploy Nemotron Worker
    needs: [test, deploy-gateway]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && hashFiles('ck-nemotron-worker/package.json') != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install wrangler
        run: npm install -g wrangler@${{ env.WRANGLER_VERSION }}
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Install nemotron dependencies
        working-directory: ck-nemotron-worker
        run: npm install --legacy-peer-deps
      - name: Deploy to Cloudflare
        working-directory: ck-nemotron-worker
        run: |
          for i in 1 2 3; do
            npx wrangler deploy && break
            echo "Attempt $i failed, retrying in 15s..." && sleep 15
          done

  smoke-test:
    name: Live Smoke Test and Status Record
    needs: [deploy-gateway, deploy-website, deploy-command-center, deploy-store]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Network liveness probes
        id: probe
        run: |
          set +e
          GATEWAY_URL="https://ck-api-gateway.david-e59.workers.dev"
          WEBSITE_URL="https://coastalkey-pm.com"
          CC_URL="https://ck-command-center.pages.dev"

          sleep 20

          GATEWAY_HEALTH=$(curl -sS --max-time 10 -L -o /dev/null -w "%{http_code}" "$GATEWAY_URL/v1/health" || echo "fail")
          GATEWAY_FRANCHISE=$(curl -sS --max-time 10 -L -o /dev/null -w "%{http_code}" "$GATEWAY_URL/v1/franchise/territories" || echo "fail")
          GATEWAY_MARKETPLACE=$(curl -sS --max-time 10 -L -o /dev/null -w "%{http_code}" "$GATEWAY_URL/v1/marketplace/catalog" || echo "fail")
          WEBSITE_HEALTH=$(curl -sS --max-time 15 -L -o /dev/null -w "%{http_code}" "$WEBSITE_URL/" || echo "fail")
          CC_HEALTH=$(curl -sS --max-time 15 -L -o /dev/null -w "%{http_code}" "$CC_URL/" || echo "fail")

          GATEWAY_ALIVE="false"
          if [ "$GATEWAY_HEALTH" != "fail" ] && [ "$GATEWAY_HEALTH" != "000" ]; then GATEWAY_ALIVE="true"; fi
          PHASE5_LIVE="false"
          if [ "$GATEWAY_FRANCHISE" = "200" ] && [ "$GATEWAY_MARKETPLACE" = "200" ]; then PHASE5_LIVE="true"; fi

          echo "gateway_health=$GATEWAY_HEALTH" >> "$GITHUB_OUTPUT"
          echo "gateway_alive=$GATEWAY_ALIVE" >> "$GITHUB_OUTPUT"
          echo "phase5_live=$PHASE5_LIVE" >> "$GITHUB_OUTPUT"
          echo "website_health=$WEBSITE_HEALTH" >> "$GITHUB_OUTPUT"
          echo "cc_health=$CC_HEALTH" >> "$GITHUB_OUTPUT"
